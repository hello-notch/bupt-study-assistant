plugins {
    id "com.android.application"
}

android {
    namespace "cn.edu.bupt.youxueban"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "cn.edu.bupt.youxueban"
        minSdk 30
        targetSdk 35
        versionCode 11001
        versionName "1.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
