[project]
name = "amadeus-qq-bot"
version = "0.1.0"
description = "A structured Amadeus QQ bot powered by NoneBot 2 and NapCat"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "playwright>=1.56.0,<2.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "markdown-it-py>=4.0.0,<5.0.0",
    "mdit-py-plugins>=0.5.0,<1.0.0",
    "tzdata>=2025.2",
    "openpyxl>=3.1.5,<4.0.0",
    "xlrd>=2.0.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
amadeus-bot = "amadeus_bot.app:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/amadeus_bot/plugins/*.py" = ["B008"]

[tool.nonebot]
plugin_dirs = ["src/amadeus_bot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
